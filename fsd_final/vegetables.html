<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vegetables - Know Your Food, Know Your Health</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #FDF5E6; /* light biscuit */
  color: #1F1F1F;
  text-align: center;
}

header {
  padding: 20px;
}

.home-link {
  font-size: 32px;
  cursor: pointer;
  display: inline-block;
  margin-bottom: 10px;
  transition: 0.3s;
}
.home-link:hover {
  color: #5B2E2E;
  transform: scale(1.2);
}

header h1 {
  font-size: 36px;
  margin-bottom: 20px;
}

.search-bar input {
  width: 320px;
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid #ccc;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
}
.search-bar input:focus {
  box-shadow: 0 0 12px rgba(139,92,246,0.5);
  border-color: #8B5CF6;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
  padding: 0 50px 60px;
  justify-items: center;
}

.card {
  width: 180px;
  height: 180px;
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  position: relative;
}

.card.flip .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  backface-visibility: hidden;
  text-align: center;
  padding: 15px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #fff;
}

.card-front h4 {
  font-size: 18px;
  margin-bottom: 8px;
}

.card-front .info p {
  font-size: 12px;
  margin: 2px 0;
}

.card-back {
  transform: rotateY(180deg);
  font-size: 13px;
  line-height: 1.3;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card:hover .card-inner {
  box-shadow: 0 0 20px 8px rgba(165, 42, 42, 0.5); /* brown glow */
  transform: scale(1.05);
}

/* Responsive */
@media(max-width:1000px){ .grid { grid-template-columns: repeat(3, 1fr); } }
@media(max-width:700px){ .grid { grid-template-columns: repeat(2, 1fr); } }
@media(max-width:500px){ .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="home-link" onclick="goHome()">🏠</div>
  <h1>Vegetables</h1>
  <div class="search-bar">
    <input type="text" placeholder="Search vegetables..." id="searchInput">
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
function goHome() { window.location.href = "home.html"; }

const vegetables = [
  {name:"Carrot 🥕",vitamins:"Vitamin A",minerals:"Potassium",benefits:"Improves vision & boosts immunity"},
  {name:"Broccoli 🥦",vitamins:"Vitamin C, K",minerals:"Calcium",benefits:"Strengthens bones & supports immunity"},
  {name:"Spinach 🌿",vitamins:"Vitamin A, C",minerals:"Iron",benefits:"Improves blood health"},
  {name:"Tomato 🍅",vitamins:"Vitamin C",minerals:"Potassium",benefits:"Supports heart & boosts immunity"},
  {name:"Cucumber 🥒",vitamins:"Vitamin K",minerals:"Potassium",benefits:"Hydrates body & supports skin"},
  {name:"Cauliflower 🥬",vitamins:"Vitamin C",minerals:"Calcium",benefits:"Boosts immunity & supports digestion"},
  {name:"Bell Pepper 🌶️",vitamins:"Vitamin C",minerals:"Potassium",benefits:"Rich antioxidants & improves skin"},
  {name:"Onion 🧅",vitamins:"Vitamin C",minerals:"Chromium",benefits:"Supports metabolism"},
  {name:"Garlic 🧄",vitamins:"Vitamin C",minerals:"Manganese",benefits:"Boosts immunity & reduces cholesterol"},
  {name:"Potato 🥔",vitamins:"Vitamin C, B6",minerals:"Potassium",benefits:"Provides energy & supports heart"},
  {name:"Sweet Potato 🍠",vitamins:"Vitamin A",minerals:"Potassium",benefits:"Supports vision & energy"},
  {name:"Cabbage 🥬",vitamins:"Vitamin K",minerals:"Calcium",benefits:"Supports bone health"},
  {name:"Lettuce 🥗",vitamins:"Vitamin K",minerals:"Calcium",benefits:"Supports digestion"},
  {name:"Zucchini 🫛",vitamins:"Vitamin C",minerals:"Potassium",benefits:"Boosts immunity & aids digestion"},
  {name:"Eggplant 🍆",vitamins:"Vitamin B1",minerals:"Copper",benefits:"Supports heart & digestion"},
  {name:"Peas 🟢",vitamins:"Vitamin C, K",minerals:"Iron",benefits:"Boosts immunity & supports bones"},
  {name:"Corn 🌽",vitamins:"Vitamin B, C",minerals:"Magnesium",benefits:"Provides energy & aids digestion"},
  {name:"Radish 🌶",vitamins:"Vitamin C",minerals:"Potassium",benefits:"Supports skin & immunity"},
  {name:"Beetroot 🥕",vitamins:"Vitamin C",minerals:"Iron",benefits:"Improves blood & supports heart"},
  {name:"Mushroom 🍄",vitamins:"Vitamin D",minerals:"Selenium",benefits:"Boosts immunity & supports bones"}
];

const grid = document.getElementById("grid");

function loadVegetables(list){
  grid.innerHTML = "";
  list.forEach(v => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front">
          <h4>${v.name}</h4>
          <div class="info">
            <p>${v.vitamins}</p>
            <p>${v.minerals}</p>
          </div>
        </div>
        <div class="card-back">
          <p>${v.benefits}</p>
        </div>
      </div>
    `;
    card.onclick = ()=>card.classList.toggle("flip");
    grid.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input", function(){
  const q = this.value.toLowerCase();
  const filtered = vegetables.filter(v=>v.name.toLowerCase().includes(q));
  loadVegetables(filtered);
});

loadVegetables(vegetables);
</script>
</body>
</html>
