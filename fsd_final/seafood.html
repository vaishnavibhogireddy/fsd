<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seafood - Know Your Food, Know Your Health</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #FDF5E6;
  color: #1F1F1F;
  text-align: center;
}

header {
  padding: 20px;
}

.home-link {
  font-size: 32px;
  cursor: pointer;
  display: inline-block;
  margin-bottom: 10px;
  transition: 0.3s;
}
.home-link:hover {
  color: #5B2E2E;
  transform: scale(1.2);
}

header h1 {
  font-size: 36px;
  margin-bottom: 20px;
}

.search-bar input {
  width: 320px;
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid #ccc;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
}
.search-bar input:focus {
  box-shadow: 0 0 12px rgba(139,92,246,0.5);
  border-color: #8B5CF6;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
  padding: 0 50px 60px;
  justify-items: center;
}

.card {
  width: 180px;
  height: 180px;
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  position: relative;
}

.card.flip .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  backface-visibility: hidden;
  text-align: center;
  padding: 15px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #fff;
}

.card-front h4 {
  font-size: 18px;
  margin-bottom: 8px;
}

.card-front .info p {
  font-size: 12px;
  margin: 2px 0;
}

.card-back {
  transform: rotateY(180deg);
  font-size: 13px;
  line-height: 1.3;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card:hover .card-inner {
  box-shadow: 0 0 20px 8px rgba(165, 42, 42, 0.5);
  transform: scale(1.05);
}

@media(max-width:1000px){ .grid { grid-template-columns: repeat(3, 1fr); } }
@media(max-width:700px){ .grid { grid-template-columns: repeat(2, 1fr); } }
@media(max-width:500px){ .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="home-link" onclick="goHome()">🏠</div>
  <h1>Seafood</h1>
  <div class="search-bar">
    <input type="text" placeholder="Search seafood..." id="searchInput">
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
function goHome() { window.location.href = "home.html"; }

const seafoods = [
  {name:"Salmon 🐟",vitamins:"B12, D",minerals:"Selenium",benefits:"Supports heart & brain health"},
  {name:"Tuna 🐠",vitamins:"B3, B12",minerals:"Magnesium",benefits:"Boosts energy & muscles"},
  {name:"Shrimp 🍤",vitamins:"B12, D",minerals:"Iodine",benefits:"Low calorie, rich protein"},
  {name:"Crab 🦀",vitamins:"B12, B6",minerals:"Zinc",benefits:"Supports immunity & bones"},
  {name:"Lobster 🦞",vitamins:"B12, B6",minerals:"Copper",benefits:"High protein & energy"},
  {name:"Clams 🐚",vitamins:"B12, C",minerals:"Iron",benefits:"Supports blood & heart"},
  {name:"Mussels 🦪",vitamins:"B12, C",minerals:"Iron",benefits:"Rich in protein & minerals"},
  {name:"Oysters 🦪",vitamins:"B12, D",minerals:"Zinc",benefits:"Boosts immunity & energy"},
  {name:"Octopus 🐙",vitamins:"B12, B6",minerals:"Selenium",benefits:"Lean protein & brain health"},
  {name:"Squid 🦑",vitamins:"B12, B6",minerals:"Copper",benefits:"Supports muscles & metabolism"},
  {name:"Cod 🐟",vitamins:"B12, D",minerals:"Phosphorus",benefits:"Supports bones & heart"},
  {name:"Herring 🐟",vitamins:"B12, D",minerals:"Iodine",benefits:"Good for brain & heart"},
  {name:"Sardines 🐟",vitamins:"B12, D",minerals:"Calcium",benefits:"Supports bones & heart"},
  {name:"Anchovy 🐟",vitamins:"B12, D",minerals:"Iron",benefits:"Rich in protein & omega-3"},
  {name:"Halibut 🐟",vitamins:"B12, D",minerals:"Magnesium",benefits:"Lean protein, supports heart"},
  {name:"Sea Bass 🐟",vitamins:"B12, D",minerals:"Potassium",benefits:"Boosts energy & immunity"},
  {name:"Catfish 🐟",vitamins:"B12, D",minerals:"Phosphorus",benefits:"Supports muscles & bones"},
  {name:"Snapper 🐟",vitamins:"B12, D",minerals:"Selenium",benefits:"Heart friendly, high protein"},
  {name:"Tilapia 🐟",vitamins:"B12, D",minerals:"Phosphorus",benefits:"Lean protein, boosts energy"},
  {name:"Mackerel 🐟",vitamins:"B12, D",minerals:"Omega-3",benefits:"Supports heart & brain health"}
];

const grid=document.getElementById("grid");

function loadSeafoods(list){
  grid.innerHTML="";
  list.forEach(s=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="card-inner">
        <div class="card-front">
          <h4>${s.name}</h4>
          <div class="info">
            <p>${s.vitamins}</p>
            <p>${s.minerals}</p>
          </div>
        </div>
        <div class="card-back">
          <p>${s.benefits}</p>
        </div>
      </div>
    `;
    card.onclick=()=>card.classList.toggle("flip");
    grid.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input",function(){
  const q=this.value.toLowerCase();
  const filtered=seafoods.filter(s=>s.name.toLowerCase().includes(q));
  loadSeafoods(filtered);
});

loadSeafoods(seafoods);
</script>
</body>
</html>
