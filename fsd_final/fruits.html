<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fruits - Know Your Food, Know Your Health</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #FDF5E6;
  color: #1F1F1F;
  text-align: center;
  min-height: 100vh;
}

header {
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.home-link {
  cursor: pointer;
  font-size: 26px;
  margin-bottom: 10px;
  transition: 0.3s;
}
.home-link:hover {
  color: #5B2E2E;
  transform: scale(1.2);
}

header h1 {
  font-size: 36px;
  margin-bottom: 20px;
}

.search-bar input {
  width: 320px;
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid #ccc;
  font-size: 16px;
  outline: none;
}
.search-bar input:focus {
  box-shadow: 0 0 12px rgba(139,92,246,0.5);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
  padding: 40px;
}

/* CARD */
.card {
  width: 180px;
  height: 180px;
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card.flip .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 12px;
  text-align: center;
}

.card-front h4 {
  font-size: 18px;
  margin-bottom: 6px;
}

.card-front p {
  font-size: 12px;
  margin: 2px 0;
}

.card-back {
  transform: rotateY(180deg);
  font-size: 13px;
}

/* HOVER GLOW */
.card:hover .card-inner {
  box-shadow: 0 0 20px 8px rgba(165,42,42,0.5);
  transform: scale(1.05);
}

/* RESPONSIVE */
@media(max-width:1000px){ .grid{grid-template-columns:repeat(3,1fr);} }
@media(max-width:700px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:500px){ .grid{grid-template-columns:1fr;} }

</style>
</head>

<body>

<header>
  <div class="home-link" onclick="goHome()">🏠</div>
  <h1>Fruits</h1>

  <div class="search-bar">
    <input type="text" placeholder="Search fruits..." id="searchInput">
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
function goHome() {
  window.location.href = "home.html";
}

const fruits = [
  {name:"Apple 🍎",vitamins:"Vitamin C",minerals:"Potassium",benefits:"Supports heart & blood flow"},
  {name:"Banana 🍌",vitamins:"Vitamin B6",minerals:"Magnesium",benefits:"Boosts energy & muscles"},
  {name:"Orange 🍊",vitamins:"Vitamin C",minerals:"Calcium",benefits:"Boosts immunity"},
  {name:"Mango 🥭",vitamins:"Vitamin A, C",minerals:"Potassium",benefits:"Improves eyesight"},
  {name:"Papaya 🧡",vitamins:"Vitamin A, C",minerals:"Folate",benefits:"Aids digestion"},
  {name:"Watermelon 🍉",vitamins:"Vitamin A, C",minerals:"Magnesium",benefits:"Hydrates body"},
  {name:"Grapes 🍇",vitamins:"Vitamin K",minerals:"Copper",benefits:"Supports heart"},
  {name:"Strawberry 🍓",vitamins:"Vitamin C",minerals:"Manganese",benefits:"Rich antioxidants"},
  {name:"Blueberry 🫐",vitamins:"Vitamin K",minerals:"Manganese",benefits:"Boosts brain"},
  {name:"Kiwi 🥝",vitamins:"Vitamin C, K",minerals:"Potassium",benefits:"Improves digestion"},
  {name:"Pear 🍐",vitamins:"Vitamin C",minerals:"Copper",benefits:"Gut health"},
  {name:"Peach 🍑",vitamins:"Vitamin A, C",minerals:"Potassium",benefits:"Improves skin"},
  {name:"Cherry 🍒",vitamins:"Vitamin C",minerals:"Potassium",benefits:"Reduces inflammation"},
  {name:"Avocado 🥑",vitamins:"Vitamin E, K",minerals:"Potassium",benefits:"Healthy fats"},
  {name:"Coconut 🥥",vitamins:"Vitamin C",minerals:"Iron",benefits:"Boosts energy"},
  {name:"Lemon 🍋",vitamins:"Vitamin C",minerals:"Calcium",benefits:"Boosts immunity"},
  {name:"Fig 🍈",vitamins:"Vitamin B6",minerals:"Calcium",benefits:"Strengthens bones"},
  {name:"Plum 🍑",vitamins:"Vitamin C",minerals:"Potassium",benefits:"Heart health"},
  {name:"Dragon Fruit 🐉",vitamins:"Vitamin C",minerals:"Iron",benefits:"Boosts immunity"},
  {name:"Lychee 🍥",vitamins:"Vitamin C",minerals:"Copper",benefits:"Improves skin"}
];

const grid = document.getElementById("grid");

function loadFruits(list){
  grid.innerHTML = "";
  list.forEach(f => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front">
          <h4>${f.name}</h4>
          <p>${f.vitamins}</p>
          <p>${f.minerals}</p>
        </div>
        <div class="card-back">
          <p>${f.benefits}</p>
        </div>
      </div>
    `;

    card.onclick = () => card.classList.toggle("flip");
    grid.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input", function(){
  const q = this.value.toLowerCase();
  const filtered = fruits.filter(f => f.name.toLowerCase().includes(q));
  loadFruits(filtered);
});

loadFruits(fruits);
</script>

</body>
</html>
