
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dairy Products - Know Your Food, Know Your Health</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #FDF5E6;
  color: #1F1F1F;
  text-align: center;
}

header {
  padding: 20px;
}

.home-link {
  font-size: 32px;
  cursor: pointer;
  display: inline-block;
  margin-bottom: 10px;
  transition: 0.3s;
}
.home-link:hover {
  color: #5B2E2E;
  transform: scale(1.2);
}

header h1 {
  font-size: 36px;
  margin-bottom: 20px;
}

.search-bar input {
  width: 320px;
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid #ccc;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
}
.search-bar input:focus {
  box-shadow: 0 0 12px rgba(139,92,246,0.5);
  border-color: #8B5CF6;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
  padding: 0 50px 60px;
  justify-items: center;
}

.card {
  width: 180px;
  height: 180px;
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  position: relative;
}

.card.flip .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  backface-visibility: hidden;
  text-align: center;
  padding: 15px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #fff;
}

.card-front h4 {
  font-size: 18px;
  margin-bottom: 8px;
}

.card-front .info p {
  font-size: 12px;
  margin: 2px 0;
}

.card-back {
  transform: rotateY(180deg);
  font-size: 13px;
  line-height: 1.3;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card:hover .card-inner {
  box-shadow: 0 0 20px 8px rgba(165, 42, 42, 0.5);
  transform: scale(1.05);
}

@media(max-width:1000px){ .grid { grid-template-columns: repeat(3, 1fr); } }
@media(max-width:700px){ .grid { grid-template-columns: repeat(2, 1fr); } }
@media(max-width:500px){ .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="home-link" onclick="goHome()">🏠</div>
  <h1>Dairy Products</h1>
  <div class="search-bar">
    <input type="text" placeholder="Search dairy..." id="searchInput">
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
function goHome() { window.location.href = "home.html"; }

const dairy = [
  {name:"Milk 🥛",vitamins:"B2, B12, D",minerals:"Calcium",benefits:"Strengthens bones & teeth"},
  {name:"Cheese 🧀",vitamins:"A, B12",minerals:"Calcium",benefits:"Supports bones & heart"},
  {name:"Yogurt 🍶",vitamins:"B2, B12",minerals:"Calcium",benefits:"Improves digestion & immunity"},
  {name:"Butter 🧈",vitamins:"A, D",minerals:"Calcium",benefits:"Energy & fat-soluble vitamins"},
  {name:"Cream 🍦",vitamins:"A, D",minerals:"Calcium",benefits:"Energy & flavor enhancer"},
  {name:"Ghee 🧈",vitamins:"A, E",minerals:"Calcium",benefits:"Boosts energy & immunity"},
  {name:"Paneer 🧀",vitamins:"B12, D",minerals:"Calcium",benefits:"Supports muscles & bones"},
  {name:"Kefir 🥛",vitamins:"B12, D",minerals:"Calcium",benefits:"Gut friendly & immunity boost"},
  {name:"Buttermilk 🥛",vitamins:"B12, D",minerals:"Calcium",benefits:"Aids digestion & hydration"},
  {name:"Condensed Milk 🥛",vitamins:"A, B12",minerals:"Calcium",benefits:"Energy rich & sweet"},
  {name:"Skim Milk 🥛",vitamins:"B2, B12",minerals:"Calcium",benefits:"Low fat, bone health"},
  {name:"Evaporated Milk 🥛",vitamins:"A, B12",minerals:"Calcium",benefits:"Energy & calcium boost"},
  {name:"Powdered Milk 🥛",vitamins:"B2, B12",minerals:"Calcium",benefits:"Convenient & nutritious"},
  {name:"Cream Cheese 🧀",vitamins:"A, B12",minerals:"Calcium",benefits:"Energy & flavor"},
  {name:"Ricotta 🧀",vitamins:"B12, D",minerals:"Calcium",benefits:"Supports muscles & bones"},
  {name:"Mascarpone 🧀",vitamins:"A, B12",minerals:"Calcium",benefits:"Dessert & energy"},
  {name:"Sour Cream 🍶",vitamins:"B12, D",minerals:"Calcium",benefits:"Supports digestion & flavor"},
  {name:"Labneh 🥛",vitamins:"B2, B12",minerals:"Calcium",benefits:"Gut friendly & protein rich"},
  {name:"Clotted Cream 🍦",vitamins:"A, B12",minerals:"Calcium",benefits:"Energy & taste"},
  {name:"Gouda 🧀",vitamins:"A, B12",minerals:"Calcium",benefits:"Bone & heart support"}
];

const grid=document.getElementById("grid");

function loadDairy(list){
  grid.innerHTML="";
  list.forEach(d=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="card-inner">
        <div class="card-front">
          <h4>${d.name}</h4>
          <div class="info">
            <p>${d.vitamins}</p>
            <p>${d.minerals}</p>
          </div>
        </div>
        <div class="card-back">
          <p>${d.benefits}</p>
        </div>
      </div>
    `;
    card.onclick=()=>card.classList.toggle("flip");
    grid.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input",function(){
  const q=this.value.toLowerCase();
  const filtered=dairy.filter(d=>d.name.toLowerCase().includes(q));
  loadDairy(filtered);
});

loadDairy(dairy);
</script>
</body>
</html>
