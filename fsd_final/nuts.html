
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nuts - Know Your Food, Know Your Health</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #FDF5E6;
  color: #1F1F1F;
  text-align: center;
}

header {
  padding: 20px;
}

.home-link {
  font-size: 32px;
  cursor: pointer;
  display: inline-block;
  margin-bottom: 10px;
  transition: 0.3s;
}
.home-link:hover {
  color: #5B2E2E;
  transform: scale(1.2);
}

header h1 {
  font-size: 36px;
  margin-bottom: 20px;
}

.search-bar input {
  width: 320px;
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid #ccc;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
}
.search-bar input:focus {
  box-shadow: 0 0 12px rgba(139,92,246,0.5);
  border-color: #8B5CF6;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
  padding: 0 50px 60px;
  justify-items: center;
}

.card {
  width: 180px;
  height: 180px;
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  position: relative;
}

.card.flip .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  backface-visibility: hidden;
  text-align: center;
  padding: 15px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #fff;
}

.card-front h4 {
  font-size: 18px;
  margin-bottom: 8px;
}

.card-front .info p {
  font-size: 12px;
  margin: 2px 0;
}

.card-back {
  transform: rotateY(180deg);
  font-size: 13px;
  line-height: 1.3;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card:hover .card-inner {
  box-shadow: 0 0 20px 8px rgba(165, 42, 42, 0.5);
  transform: scale(1.05);
}

@media(max-width:1000px){ .grid { grid-template-columns: repeat(3, 1fr); } }
@media(max-width:700px){ .grid { grid-template-columns: repeat(2, 1fr); } }
@media(max-width:500px){ .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="home-link" onclick="goHome()">🏠</div>
  <h1>Nuts</h1>
  <div class="search-bar">
    <input type="text" placeholder="Search nuts..." id="searchInput">
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
function goHome() { window.location.href = "home.html"; }

const nuts = [
  {name:"Almonds 🌰",vitamins:"E, B2",minerals:"Magnesium",benefits:"Boosts brain & heart health"},
  {name:"Cashews 🥜",vitamins:"B6, K",minerals:"Magnesium",benefits:"Supports bones & energy"},
  {name:"Walnuts 🌰",vitamins:"B6, E",minerals:"Copper",benefits:"Good for brain & heart"},
  {name:"Pistachios 🥜",vitamins:"B6",minerals:"Potassium",benefits:"Improves digestion & heart"},
  {name:"Hazelnuts 🌰",vitamins:"E, B1",minerals:"Magnesium",benefits:"Supports skin & heart"},
  {name:"Macadamia 🥜",vitamins:"B1, E",minerals:"Manganese",benefits:"Boosts energy & brain"},
  {name:"Brazil Nuts 🌰",vitamins:"E, B1",minerals:"Selenium",benefits:"Supports immunity & heart"},
  {name:"Pecans 🥜",vitamins:"B1, E",minerals:"Zinc",benefits:"Good for heart & metabolism"},
  {name:"Chestnuts 🌰",vitamins:"C, B6",minerals:"Copper",benefits:"Supports digestion & energy"},
  {name:"Coconut 🥥",vitamins:"C, B6",minerals:"Iron",benefits:"Boosts energy & hydration"},
  {name:"Peanuts 🥜",vitamins:"B3, E",minerals:"Magnesium",benefits:"Supports heart & muscles"},
  {name:"Tiger Nuts 🌰",vitamins:"C, E",minerals:"Iron",benefits:"Improves digestion & energy"},
  {name:"Pine Nuts 🌲",vitamins:"K, B1",minerals:"Magnesium",benefits:"Boosts immunity & brain"},
  {name:"Marcona Almonds 🌰",vitamins:"E, B2",minerals:"Magnesium",benefits:"Heart health & brain"},
  {name:"Ginkgo Nuts 🌰",vitamins:"C, B6",minerals:"Potassium",benefits:"Supports brain & heart"},
  {name:"Kola Nuts 🌰",vitamins:"C, B1",minerals:"Magnesium",benefits:"Boosts energy & metabolism"},
  {name:"Candlenuts 🌰",vitamins:"B1, E",minerals:"Selenium",benefits:"Supports brain & heart"},
  {name:"Beechnuts 🌰",vitamins:"E, B6",minerals:"Magnesium",benefits:"Good for bones & digestion"},
  {name:"Candleberry Nuts 🌰",vitamins:"B1, C",minerals:"Iron",benefits:"Boosts immunity & energy"},
  {name:"Hickory Nuts 🌰",vitamins:"B1, E",minerals:"Zinc",benefits:"Supports heart & metabolism"}
];

const grid = document.getElementById("grid");

function loadNuts(list){
  grid.innerHTML = "";
  list.forEach(n=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="card-inner">
        <div class="card-front">
          <h4>${n.name}</h4>
          <div class="info">
            <p>${n.vitamins}</p>
            <p>${n.minerals}</p>
          </div>
        </div>
        <div class="card-back">
          <p>${n.benefits}</p>
        </div>
      </div>
    `;
    card.onclick=()=>card.classList.toggle("flip");
    grid.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input",function(){
  const q=this.value.toLowerCase();
  const filtered=nuts.filter(n=>n.name.toLowerCase().includes(q));
  loadNuts(filtered);
});

loadNuts(nuts);
</script>
</body>
</html>
