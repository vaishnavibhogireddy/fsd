<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grains - Know Your Food, Know Your Health</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #FDF5E6;
  color: #1F1F1F;
  text-align: center;
}

header {
  padding: 20px;
}

.home-link {
  font-size: 32px;
  cursor: pointer;
  display: inline-block;
  margin-bottom: 10px;
  transition: 0.3s;
}
.home-link:hover {
  color: #5B2E2E;
  transform: scale(1.2);
}

header h1 {
  font-size: 36px;
  margin-bottom: 20px;
}

.search-bar input {
  width: 320px;
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid #ccc;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
}
.search-bar input:focus {
  box-shadow: 0 0 12px rgba(139,92,246,0.5);
  border-color: #8B5CF6;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
  padding: 0 50px 60px;
  justify-items: center;
}

.card {
  width: 180px;
  height: 180px;
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  position: relative;
}

.card.flip .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  backface-visibility: hidden;
  text-align: center;
  padding: 15px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #fff;
}

.card-front h4 {
  font-size: 18px;
  margin-bottom: 8px;
}

.card-front .info p {
  font-size: 12px;
  margin: 2px 0;
}

.card-back {
  transform: rotateY(180deg);
  font-size: 13px;
  line-height: 1.3;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card:hover .card-inner {
  box-shadow: 0 0 20px 8px rgba(165, 42, 42, 0.5);
  transform: scale(1.05);
}

@media(max-width:1000px){ .grid { grid-template-columns: repeat(3, 1fr); } }
@media(max-width:700px){ .grid { grid-template-columns: repeat(2, 1fr); } }
@media(max-width:500px){ .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="home-link" onclick="goHome()">🏠</div>
  <h1>Grains</h1>
  <div class="search-bar">
    <input type="text" placeholder="Search grains..." id="searchInput">
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
function goHome() { window.location.href = "home.html"; }

const grains = [
  {name:"Rice 🌾",vitamins:"B1, B3",minerals:"Magnesium",benefits:"Energy source, supports metabolism"},
  {name:"Wheat 🌾",vitamins:"B1, B3",minerals:"Iron",benefits:"Boosts energy & digestion"},
  {name:"Oats 🥣",vitamins:"B1, B5",minerals:"Manganese",benefits:"Supports heart & cholesterol"},
  {name:"Barley 🌾",vitamins:"B1, B3",minerals:"Selenium",benefits:"Aids digestion & immunity"},
  {name:"Quinoa 🍚",vitamins:"B6, B9",minerals:"Magnesium",benefits:"Complete protein, boosts energy"},
  {name:"Millet 🌾",vitamins:"B1, B2",minerals:"Phosphorus",benefits:"Supports bones & digestion"},
  {name:"Corn 🌽",vitamins:"B1, B5",minerals:"Magnesium",benefits:"Energy & digestion"},
  {name:"Buckwheat 🌾",vitamins:"B1, B2",minerals:"Manganese",benefits:"Heart friendly & gluten-free"},
  {name:"Rye 🌾",vitamins:"B1, B2",minerals:"Magnesium",benefits:"Supports digestion & heart"},
  {name:"Sorghum 🌾",vitamins:"B1, B2",minerals:"Iron",benefits:"Energy & fiber rich"},
  {name:"Amaranth 🌱",vitamins:"B6, C",minerals:"Iron",benefits:"Supports muscles & heart"},
  {name:"Spelt 🌾",vitamins:"B1, B3",minerals:"Magnesium",benefits:"Energy & digestion"},
  {name:"Teff 🌾",vitamins:"B1, B2",minerals:"Calcium",benefits:"Supports bones & metabolism"},
  {name:"Farro 🌾",vitamins:"B1, B3",minerals:"Magnesium",benefits:"Heart healthy & fiber-rich"},
  {name:"Wild Rice 🌾",vitamins:"B1, B6",minerals:"Manganese",benefits:"Energy & antioxidant-rich"},
  {name:"Freekeh 🌾",vitamins:"B1, B3",minerals:"Iron",benefits:"Supports digestion & energy"},
  {name:"Kamut 🌾",vitamins:"B1, B3",minerals:"Magnesium",benefits:"Heart & metabolism support"},
  {name:"Fonio 🌾",vitamins:"B1, B2",minerals:"Iron",benefits:"Energy & fiber-rich"},
  {name:"Triticale 🌾",vitamins:"B1, B2",minerals:"Magnesium",benefits:"Boosts energy & digestion"},
  {name:"Barley Grass 🌱",vitamins:"A, C",minerals:"Iron",benefits:"Detox & energy boost"}
];

const grid=document.getElementById("grid");

function loadGrains(list){
  grid.innerHTML="";
  list.forEach(g=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="card-inner">
        <div class="card-front">
          <h4>${g.name}</h4>
          <div class="info">
            <p>${g.vitamins}</p>
            <p>${g.minerals}</p>
          </div>
        </div>
        <div class="card-back">
          <p>${g.benefits}</p>
        </div>
      </div>
    `;
    card.onclick=()=>card.classList.toggle("flip");
    grid.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input",function(){
  const q=this.value.toLowerCase();
  const filtered=grains.filter(g=>g.name.toLowerCase().includes(q));
  loadGrains(filtered);
});

loadGrains(grains);
</script>
</body>
</html>
