<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Other Foods - Know Your Food, Know Your Health</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #FDF5E6;
  color: #1F1F1F;
  text-align: center;
}

header {
  padding: 20px;
}

.home-link {
  font-size: 32px;
  cursor: pointer;
  display: inline-block;
  margin-bottom: 10px;
  transition: 0.3s;
}
.home-link:hover {
  color: #5B2E2E;
  transform: scale(1.2);
}

header h1 {
  font-size: 36px;
  margin-bottom: 20px;
}

.search-bar input {
  width: 320px;
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid #ccc;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
}
.search-bar input:focus {
  box-shadow: 0 0 12px rgba(139,92,246,0.5);
  border-color: #8B5CF6;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
  padding: 0 50px 60px;
  justify-items: center;
}

.card {
  width: 180px;
  height: 180px;
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  position: relative;
}

.card.flip .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  backface-visibility: hidden;
  text-align: center;
  padding: 15px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #fff;
}

.card-front h4 {
  font-size: 18px;
  margin-bottom: 8px;
}

.card-front .info p {
  font-size: 12px;
  margin: 2px 0;
}

.card-back {
  transform: rotateY(180deg);
  font-size: 13px;
  line-height: 1.3;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card:hover .card-inner {
  box-shadow: 0 0 20px 8px rgba(165, 42, 42, 0.5);
  transform: scale(1.05);
}

@media(max-width:1000px){ .grid { grid-template-columns: repeat(3, 1fr); } }
@media(max-width:700px){ .grid { grid-template-columns: repeat(2, 1fr); } }
@media(max-width:500px){ .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="home-link" onclick="goHome()">🏠</div>
  <h1>Other Foods</h1>
  <div class="search-bar">
    <input type="text" placeholder="Search foods..." id="searchInput">
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
function goHome() { window.location.href = "home.html"; }

const others = [
  {name:"Turmeric 🌿",vitamins:"C, B6",minerals:"Iron",benefits:"Anti-inflammatory & antioxidant"},
  {name:"Cinnamon 🌿",vitamins:"K, B6",minerals:"Calcium",benefits:"Controls sugar & digestion"},
  {name:"Green Tea 🍵",vitamins:"C, K",minerals:"Manganese",benefits:"Boosts metabolism & immunity"},
  {name:"Coffee ☕",vitamins:"B2, B3",minerals:"Magnesium",benefits:"Energy & alertness"},
  {name:"Honey 🍯",vitamins:"B2, B6",minerals:"Calcium",benefits:"Boosts immunity & skin"},
  {name:"Chocolate 🍫",vitamins:"B2, B3",minerals:"Magnesium",benefits:"Mood booster & antioxidant"},
  {name:"Ice Cream 🍦",vitamins:"A, D",minerals:"Calcium",benefits:"Energy & calcium"},
  {name:"Popcorn 🍿",vitamins:"B1",minerals:"Magnesium",benefits:"Low-calorie snack & fiber"},
  {name:"Cookies 🍪",vitamins:"B2, B3",minerals:"Iron",benefits:"Quick energy & taste"},
  {name:"Olive Oil 🛢️",vitamins:"E",minerals:"Iron",benefits:"Heart healthy & antioxidants"},
  {name:"Coconut Oil 🥥",vitamins:"E",minerals:"Iron",benefits:"Skin & energy"},
  {name:"Ginger 🌿",vitamins:"C, B6",minerals:"Magnesium",benefits:"Aids digestion & immunity"},
  {name:"Salt 🧂",vitamins:"-",minerals:"Sodium",benefits:"Electrolyte balance"},
  {name:"Sugar 🍬",vitamins:"-",minerals:"-",benefits:"Quick energy"},
  {name:"Maple Syrup 🍁",vitamins:"B2",minerals:"Manganese",benefits:"Natural sweetener"},
  {name:"Soy Sauce 🥢",vitamins:"B3",minerals:"Sodium",benefits:"Flavor enhancer & digestion"},
  {name:"Vinegar 🧴",vitamins:"-",minerals:"-",benefits:"Digestive aid"},
  {name:"Peanut Butter 🥜",vitamins:"E, B3",minerals:"Magnesium",benefits:"Energy & healthy fats"},
  {name:"Jam 🍓",vitamins:"C",minerals:"Iron",benefits:"Energy & antioxidants"},
  {name:"Mustard 🌿",vitamins:"C, K",minerals:"Calcium",benefits:"Metabolism & flavor"}
];

const grid=document.getElementById("grid");

function loadOthers(list){
  grid.innerHTML="";
  list.forEach(d=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="card-inner">
        <div class="card-front">
          <h4>${d.name}</h4>
          <div class="info">
            <p>${d.vitamins}</p>
            <p>${d.minerals}</p>
          </div>
        </div>
        <div class="card-back">
          <p>${d.benefits}</p>
        </div>
      </div>
    `;
    card.onclick=()=>card.classList.toggle("flip");
    grid.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input",function(){
  const q=this.value.toLowerCase();
  const filtered=others.filter(d=>d.name.toLowerCase().includes(q));
  loadOthers(filtered);
});

loadOthers(others);
</script>
</body>
</html>
